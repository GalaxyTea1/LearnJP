# Builds and deploys one environment. Called by deploy.yml; not run on its own.
name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        required: true
        type: string
      ref:
        description: Commit to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.FRONTEND_URL }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: wrangler.${{ inputs.environment }}.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend

      - name: Write wrangler config
        run: node scripts/tools/write-wrangler-config.mjs ${{ inputs.environment }}
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_AUTH_ENABLED: ${{ vars.GOOGLE_AUTH_ENABLED }}
          EMAIL_AUTH_ENABLED: ${{ vars.EMAIL_AUTH_ENABLED }}
          DOMAINS: ${{ vars.DOMAINS }}

      - run: npm run build

      # Staging takes new migrations automatically. Production stops instead, because
      # docs/deployment.md requires a backup before migrating it; apply them by hand, then re-run.
      - name: Database migrations
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            npx wrangler d1 migrations apply DB --remote --config "$CONFIG"
          else
            out=$(npx wrangler d1 migrations list DB --remote --config "$CONFIG" 2>&1)
            echo "$out"
            if ! grep -q "No migrations to apply" <<<"$out"; then
              echo "::error::Production has unapplied migrations. Back up (npm run backup:production), apply them by hand, then re-run this deploy."
              exit 1
            fi
          fi

      - name: Deploy Worker
        run: npx wrangler deploy --config "$CONFIG"

      - name: Health check
        run: |
          url="${{ vars.FRONTEND_URL }}/api/v1/health"
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS "$url" || true)
            if grep -q '"ready":true' <<<"$body"; then echo "Healthy: $body"; exit 0; fi
            echo "Attempt $i: ${body:-no response}"; sleep 10
          done
          echo "::error::$url did not report ready"
          exit 1
