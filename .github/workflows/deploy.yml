# Staging deploys automatically once CI passes on main.
# Production is deployed by hand: Actions → Deploy → Run workflow → target "production".
# That run deploys the latest main to staging first, then to production.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy main
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  actions: read

jobs:
  # Pick the commit and make sure CI passed for it.
  prepare:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            conclusion=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --commit "$SHA" \
              --json conclusion --jq '[.[] | select(.conclusion != "")][0].conclusion')
            if [ "$conclusion" != "success" ]; then
              echo "::error::CI has not passed for $SHA (latest result: ${conclusion:-none}). Wait for CI or fix it first."
              exit 1
            fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  staging:
    needs: prepare
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  production:
    needs: [prepare, staging]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit
